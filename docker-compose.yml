version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: capstone-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend API Service (Go Gin)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: capstone-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION_DURATION: ${JWT_EXPIRATION_DURATION}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      OMISE_PUBLIC_KEY: ${OMISE_PUBLIC_KEY}
      OMISE_SECRET_KEY: ${OMISE_SECRET_KEY}
      OMISE_WEBHOOK_SECRET: ${OMISE_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy

  # 3. Frontend Web Service (Next.js Standalone)
  frontend:
    build:
      context: ./Frontend/my-app
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    container_name: capstone-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # 4. Adminer (Web Database Client)
  adminer:
    image: adminer:latest
    container_name: capstone-adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data:
